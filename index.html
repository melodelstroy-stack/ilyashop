<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL ROULETTE x36</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .game-card { background: #151d30; border: 1px solid #222f4d; border-radius: 24px; padding: 35px; max-width: 480px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #1e2942; padding: 12px 20px; border-radius: 14px; }
        .logo { font-weight: 800; font-size: 18px; color: #22c55e; letter-spacing: 1px; }
        .balance-box { font-weight: 700; color: #22c55e; font-size: 18px; }
        
        /* ЗОНА КАРТИНКИ КОЛЕСА */
        .wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 0 auto 25px; }
        
        /* Стрелочка на Зеро */
        .arrow { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #22c55e; z-index: 10; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5)); }
        
        /* Ваше колесо из файла wheel.png */
        .wheel { width: 100%; height: 100%; border-radius: 50%; background-image: url('wheel.png'); background-size: cover; background-position: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); position: relative; }
        
        .status-text { font-size: 15px; color: #94a3b8; margin-bottom: 20px; min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 500; line-height: 1.4; }
        
        /* Блок ввода ставок */
        .inputs-container { display: flex; gap: 15px; margin-bottom: 20px; text-align: left; }
        .input-group { flex: 1; }
        label { display: block; font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; background: #1e2942; border: 1px solid #2a3b5c; padding: 12px; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600; outline: none; text-align: center; transition: 0.2s; }
        input:focus { border-color: #22c55e; }
        
        .btn-spin { display: block; width: 100%; background: #22c55e; color: #fff; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #16a34a; text-transform: uppercase; }
        .btn-spin:hover { background: #16a34a; }
        .btn-spin:active { transform: translateY(3px); box-shadow: none; }
        
        .history { margin-top: 25px; border-top: 1px solid #222f4d; padding-top: 15px; text-align: left; }
        .history h3 { font-size: 13px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }
        .history-list { display: flex; gap: 6px; flex-wrap: wrap; }
        .hist-item { padding: 4px 8px; min-width: 32px; height: 28px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="top-bar">
            <div class="logo">ROULETTE РУЛЕТКА</div>
            <div class="balance-box"><span id="balance">1000</span> 🪙</div>
        </div>
        
        <div class="wheel-wrapper">
            <div class="arrow"></div>
            <div class="wheel" id="wheel"></div>
        </div>
        <div class="input-group">
                <label>Ваше число (0-36)</label>
                <input type="number" id="bet-number" value="7" min="0" max="36">
            </div>
            <div class="input-group">
                <label>Сумма ставки</label>
                <input type="number" id="bet-amount" value="100" min="1">
            </div>
        </div>
        
        <button class="btn-spin" onclick="startRoulette()">Запустить рулетку</button>
        
        <div class="history">
            <h3>Последние числа:</h3>
            <div class="history-list" id="history-box"></div>
        </div>
    </div>

    <script>
        let balance = 1000;
        let isPlaying = false;
        
        // Порядок чисел на европейской рулетке по часовой стрелке, начиная с Зеро (0) строго по вашей картинке:
        const rouletteNumbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const totalSectors = 37;
        const sectorAngle = 360 / totalSectors; // ~9.729 градусов на одно число

        function startRoulette() {
            if (isPlaying) return;
            
            let targetNum = parseInt(document.getElementById('bet-number').value);
            let amount = parseInt(document.getElementById('bet-amount').value);
            
            if (isNaN(targetNum) || targetNum < 0 || targetNum > 36) {
                alert('Выберите число от 0 до 36!');
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                alert('Введите корректную сумму ставки!');
                return;
            }
            if (amount > balance) {
                alert('Недостаточно монет на балансе!');
                return;
            }
            
            balance -= amount;
            document.getElementById('balance').innerText = balance;
            document.getElementById('status').innerText = `Ставка ${amount} монет на число [${targetNum}] принята. Запуск шарика на 15 секунд...`;
            isPlaying = true;
            
            runPhysicsWheel(targetNum, amount);
        }

        function runPhysicsWheel(targetNum, amount) {
            const wheel = document.getElementById('wheel');
            const totalDuration = 15000; // Ровно 15 секунд
            const fps = 60;
            const totalSteps = (totalDuration / 1000) * fps;
            
            // Выбираем случайное выигрышное число из массива рулетки
            const winningNumber = rouletteNumbers[Math.floor(Math.random() * totalSectors)];
            const winningIndex = rouletteNumbers.indexOf(winningNumber);
            
            // Рассчитываем точный угол для этого числа, чтобы оно встало ровно под верхнюю стрелку
            const targetAnglePos = winningIndex * sectorAngle;
            const stopAngle = (360 - targetAnglePos) % 360;
            
            // Добавляем 20 полных оборотов для бешеной скорости
            const finalAngle = 7200 + stopAngle;
            let currentStep = 0;
            
            function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

            const interval = setInterval(() => {
                currentStep++;
                let progress = currentStep / totalSteps;
                let currentAngle = easeOutCubic(progress) * finalAngle;
                
                wheel.style.transform = `rotate(${currentAngle}deg)`;
                
                if (currentStep >= totalSteps) {
                    clearInterval(interval);
                    
                    // Проверяем цвет для истории (Зеро - зеленый, остальные по правилам)
                    let color = '#334155'; // Черный по умолчанию
                    if (winningNumber === 0) color = '#22c55e';
                    else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(winningNumber)) color = '#ef4444'; // Красный
                        // Логика победы х36
                    if (targetNum === winningNumber) {
                        let winAmount = amount * 36;
                        balance += winAmount;
                        document.getElementById('status').innerText = `🎉 ФАНТАСТИКА! Вы угадали число [${winningNumber}]! Ваша выплата: +${winAmount} монет (х36)!`;
                    } else {
                        document.getElementById('status').innerText = `❌ Выпало число [${winningNumber}]. Повезет в следующий раз!`;
                    }
                    
                    updateHistory(winningNumber, color);
                    document.getElementById('balance').innerText = balance;
                    isPlaying = false;
                }
            }, 1000 / fps);
        }

        function updateHistory(num, color) {
            let box = document.getElementById('history-box');
            let item = document.createElement('div');
            item.className = 'hist-item';
            item.style.background = color;
            item.innerText = num;
            box.insertBefore(item, box.firstChild);
            if (box.children.length > 8) box.removeChild(box.lastChild);
        }
    </script>
</body>
</html>
        <div class="status-text" id="status">Введите число от 0 до 36, сумму ставки и крутите колесо! Выигрыш равен х36!</div>
        
        <div class="inputs-container">
