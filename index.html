<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОФЕССИОНАЛЬНАЯ РУЛЕТКА х36</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .game-card { background: #151d30; border: 1px solid #222f4d; border-radius: 24px; padding: 30px; max-width: 520px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e2942; padding: 12px 20px; border-radius: 14px; }
        .logo { font-weight: 800; font-size: 18px; color: #22c55e; letter-spacing: 1px; }
        .balance-box { font-weight: 700; color: #22c55e; font-size: 18px; }
        
        .wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 0 auto 20px; }
        .arrow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #f59e0b; z-index: 10; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5)); }
        canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .status-text { font-size: 15px; color: #94a3b8; margin-bottom: 20px; min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 500; line-height: 1.4; padding: 0 10px; }
        
        .bet-panel { background: #1b253d; padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: left; border: 1px solid #283759; }
        .panel-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; background: #151d30; border: 1px solid #2a3b5c; padding: 12px; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #22c55e; }
        
        .type-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .type-btn { flex: 1; padding: 10px; background: #243252; border: 1px solid #2e3f66; color: #94a3b8; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .type-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        
        .btn-spin { display: block; width: 100%; background: #22c55e; color: #fff; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #16a34a; text-transform: uppercase; letter-spacing: 1px; }
        .btn-spin:hover { background: #16a34a; }
        .btn-spin:active { transform: translateY(3px); box-shadow: none; }
        
        .history { margin-top: 25px; border-top: 1px solid #222f4d; padding-top: 15px; text-align: left; }
        .history h3 { font-size: 13px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }
        .history-list { display: flex; gap: 6px; flex-wrap: wrap; }
        .hist-item { padding: 4px 8px; min-width: 32px; height: 28px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="top-bar">
            <div class="logo">👑 РУЛЕТКА х36</div>
            <div class="balance-box"><span id="balance">1000</span> 🪙</div>
        </div>
        
        <div class="wheel-wrapper">
            <div class="arrow"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
        
        <div class="status-text" id="status">Сделайте ставку на число (х36) или на цвет (х2) и запускайте колесо!</div>
        
        <div class="bet-panel">
            <div class="type-selector">
                <button class="type-btn active" id="type-num-btn" onclick="setBetType('number')">На число (х36)</button>
                <button class="type-btn" id="type-color-btn" onclick="setBetType('color')">На цвет (х2)</button>
            </div>
            
            <div class="panel-row">
                <div class="input-group" id="group-number">
                    <label>Выберите число (0-36)</label>
                    <input type="number" id="bet-number" value="7" min="0" max="36">
                </div>
                
                <div class="input-group" id="group-color" style="display: none;">
                    <label>Выберите цвет</label>
                    <select id="bet-color">
                        <option value="red">Красное (К)</option>
                        <option value="black">Чёрное (Ч)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Сумма ставки</label>
                    <input type="number" id="bet-amount" value="100" min="1">
                </div>
            </div>
        </div>
        
        <button class="btn-spin" onclick="startRoulette()">Вращать рулетку</button>
        
        <div class="history">
            <h3>Последние исходы:</h3>
            <div class="history-list" id="history-box"></div>
        </div>
    </div>

    <script>
        let balance = 1000;
        let isPlaying = false;
        let betType = 'number'; 
        
        const rouletteNumbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const redNumbers = [32, 19, 21, 25, 34, 27, 36, 30, 23, 5, 16, 1, 14, 9, 18, 7, 12, 3];
        
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const totalSectors = 37;
        const sectorAngle = (2 * Math.PI) / totalSectors;
        
        function drawWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < totalSectors; i++) {
                const num = rouletteNumbers[i];
                const startAngle = (i * sectorAngle) - (Math.PI / 2) - (sectorAngle / 2);
                const endAngle = startAngle + sectorAngle;
                
                if (num === 0) ctx.fillStyle = '#22c55e'; 
                else if (redNumbers.includes(num)) ctx.fillStyle = '#ef4444'; 
                else ctx.fillStyle = '#1e293b'; 
                
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 10, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();
                
                ctx.strokeStyle = '#2d3d5a';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + sectorAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px Segoe UI";
                ctx.fillText(num, radius - 30, 0);
                ctx.restore();
            }
            
            ctx.beginPath();
            ctx.arc(radius, radius, radius * 0.6, 0, 2 * Math.PI);
            ctx.fillStyle = '#151d30';
            ctx.fill();
            ctx.strokeStyle = '#222f4d';
            ctx.lineWidth = 6;
            ctx.stroke();
        }
        
        drawWheel();
      function setBetType(type) {
            if (isPlaying) return;
            betType = type;
            
            if (type === 'number') {
                document.getElementById('type-num-btn').classList.add('active');
                document.getElementById('type-color-btn').classList.remove('active');
                document.getElementById('group-number').style.display = 'block';
                document.getElementById('group-color').style.display = 'none';
            } else {
                document.getElementById('type-num-btn').classList.remove('active');
                document.getElementById('type-color-btn').classList.add('active');
                document.getElementById('group-number').style.display = 'none';
                document.getElementById('group-color').style.display = 'block';
            }
        }

        function startRoulette() {
            if (isPlaying) return;
            
            let amount = parseInt(document.getElementById('bet-amount').value);
            let targetNum = parseInt(document.getElementById('bet-number').value);
            let targetColor = document.getElementById('bet-color').value;
            
            if (isNaN(amount) || amount <= 0) {
                alert('Введите корректную сумму ставки!');
                return;
            }
            if (amount > balance) {
                alert('Недостаточно монет на балансе!');
                return;
            }
            if (betType === 'number' && (isNaN(targetNum) || targetNum < 0 || targetNum > 36)) {
                alert('Выберите число от 0 до 36!');
                return;
            }
            
            balance -= amount;
            document.getElementById('balance').innerText = balance;
            
            if (betType === 'number') {
                document.getElementById('status').innerText = `Ставка: ${amount} монет на число [${targetNum}]. Раскрутка...`;
            } else {
              document.getElementById('status').innerText = Ставка: ${amount} монет на ${targetColor === 'red' ? 'КРАСНОЕ' : 'ЧЁРНОЕ'}. Раскрутка...;}isPlaying = true;runPhysicsWheel(amount, targetNum, targetColor);}function runPhysicsWheel(amount, targetNum, targetColor) {const totalDuration = 15000;const fps = 60;const totalSteps = (totalDuration / 1000) * fps;const winningNumber = rouletteNumbers[Math.floor(Math.random() * totalSectors)];const winningIndex = rouletteNumbers.indexOf(winningNumber);let winningColor = 'black';if (winningNumber === 0) winningColor = 'zero';else if (redNumbers.includes(winningNumber)) winningColor = 'red';const targetAnglePos = winningIndex * (360 / totalSectors);const stopAngle = (360 - targetAnglePos) % 360;const finalAngle = 9000 + stopAngle;let currentStep = 0;function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }const interval = setInterval(() => {currentStep++;let progress = currentStep / totalSteps;let currentAngle = easeOutCubic(progress) * finalAngle;canvas.style.transform = rotate(${currentAngle}deg);if (currentStep >= totalSteps) {clearInterval(interval);let isWin = false;let payout = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (betType === 'number') {if (targetNum === winningNumber) {isWin = true;payout = amount * 36;}} else if (betType === 'color') {if (targetColor === winningColor) {isWin = true;payout = amount * 2;}}let textResultColor = winningColor === 'zero' ? 'ЗЕЛЁНОЕ ЗЕРО' : (winningColor === 'red' ? 'КРАСНОЕ' : 'ЧЁРНОЕ');if (isWin) {balance += payout;document.getElementById('status').innerText = 🎉 ПОБЕДА! Выпало число [${winningNumber}] (${textResultColor}). Получено +${payout} монет!;} else {document.getElementById('status').innerText = ❌ Проигрыш. Выпало число [${winningNumber}] (${textResultColor}).;}let historyColor = '#334155';if (winningColor === 'zero') historyColor = '#22c55e';if (winningColor === 'red') historyColor = '#ef4444';updateHistory(winningNumber, historyColor);document.getElementById('balance').innerText = balance;isPlaying = false;}}, 1000 / fps);}function updateHistory(num, color) {let box = document.getElementById('history-box');let item = document.createElement('div');item.className = 'hist-item';item.style.background = color;item.innerText = num;box.insertBefore(item, box.firstChild);if (box.children.length > 10) box.removeChild(box.lastChild);}
