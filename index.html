<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РУЛЕТКА х36</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game-card { background: #151d30; border: 1px solid #222f4d; border-radius: 24px; padding: 30px; max-width: 520px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,.5); text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e2942; padding: 12px 20px; border-radius: 14px; }
        .logo { font-weight: 800; font-size: 18px; color: #22c55e; }
        .balance-box { font-weight: 700; color: #22c55e; font-size: 18px; }
        .wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 0 auto 20px; }
        .arrow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #f59e0b; z-index: 10; }
        canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,.6); transition: transform 15s cubic-bezier(0.1,0.8,0.1,1); }
        .status-text { font-size: 15px; color: #94a3b8; margin-bottom: 20px; min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 500; line-height: 1.4; }
        .bet-panel { background: #1b253d; padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: left; border: 1px solid #283759; }
        .panel-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        input, select { width: 100%; background: #151d30; border: 1px solid #2a3b5c; padding: 12px; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; outline: none; }
        input:focus, select:focus { border-color: #22c55e; }
        .type-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .type-btn { flex: 1; padding: 10px; background: #243252; border: 1px solid #2e3f66; color: #94a3b8; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .type-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .btn-spin { display: block; width: 100%; background: #22c55e; color: #fff; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #16a34a; text-transform: uppercase; }
        .btn-spin:hover { background: #16a34a; }
        .btn-spin:active { transform: translateY(3px); box-shadow: none; }
        .history { margin-top: 25px; border-top: 1px solid #222f4d; padding-top: 15px; text-align: left; }
        .history h3 { font-size: 13px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }
        .history-list { display: flex; gap: 6px; flex-wrap: wrap; }
        .hist-item { padding: 4px 8px; min-width: 32px; height: 28px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="top-bar">
            <div class="logo">👑 РУЛЕТКА х36</div>
            <div class="balance-box"><span id="balance">1000</span> 🪙</div>
        </div>
        <div class="wheel-wrapper">
            <div class="arrow"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <div class="status-text" id="status">Ставка на число (х36) или цвет (х2)!</div>
        <div class="bet-panel">
            <div class="type-selector">
                        <button class="type-btn active" id="type-num-btn" onclick="setBetType('number')">На число (х36)</button>
                <button class="type-btn" id="type-color-btn" onclick="setBetType('color')">На цвет (х2)</button>
            </div>
            <div class="panel-row">
                <div class="input-group" id="group-number">
                    <label>Число (0-36)</label>
                    <input type="number" id="bet-number" value="7" min="0" max="36">
                </div>
                <div class="input-group" id="group-color" style="display:none">
                    <label>Цвет</label>
                    <select id="bet-color">
                        <option value="red">Красное</option>
                        <option value="black">Чёрное</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Сумма ставки</label>
                    <input type="number" id="bet-amount" value="100" min="1">
                </div>
            </div>
        </div>
        <button class="btn-spin" onclick="startRoulette()">Вращать рулетку</button>
        <div class="history">
            <h3>Прошлые игры:</h3>
            <div class="history-list" id="history-box"></div>
        </div>
    </div>
    <script>
        let balance = 1000, isPlaying = false, betType = "number", currentRotation = 0;
        const canvas = document.getElementById("wheelCanvas"), ctx = canvas.getContext("2d");
        const totalSectors = 37, sectorAngle = 2 * Math.PI / totalSectors;
        
        function drawWheel() {
            const e = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let t = 0; t < totalSectors; t++) {
                const a = t * sectorAngle - Math.PI / 2 - sectorAngle / 2, n = a + sectorAngle;
                0 === t ? ctx.fillStyle = "#22c55e" : t % 2 == 1 ? ctx.fillStyle = "#ef4444" : ctx.fillStyle = "#1e293b";
                ctx.beginPath(); ctx.moveTo(e, e); ctx.arc(e, e, e - 10, a, n); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = "#2d3d5a"; ctx.lineWidth = 1; ctx.stroke();
                ctx.save(); ctx.translate(e, e); ctx.rotate(a + sectorAngle / 2);
                ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px Segoe UI"; ctx.fillText(t, e - 30, 0); ctx.restore();
            }
            ctx.beginPath(); ctx.arc(e, e, .6 * e, 0, 2 * Math.PI); ctx.fillStyle = "#151d30"; ctx.fill();
            ctx.strokeStyle = "#222f4d"; ctx.lineWidth = 6; ctx.stroke();
        }
        
        function setBetType(e) {
            if (isPlaying) return;
            betType = e;
            if ("number" === e) {
                document.getElementById("type-num-btn").classList.add("active");
                document.getElementById("type-color-btn").classList.remove("active");
                document.getElementById("group-number").style.display = "block";
                document.getElementById("group-color").style.display = "none";
            } else {
                document.getElementById("type-num-btn").classList.remove("active");
                document.getElementById("type-color-btn").classList.add("active");
                document.getElementById("group-number").style.display = "none";
                document.getElementById("group-color").style.display = "block";
            }
        }
        
        function startRoulette() {
            if (isPlaying) return;
            let e = parseInt(document.getElementById("bet-amount").value);
            let t = parseInt(document.getElementById("bet-number").value);
            let a = document.getElementById("bet-color").value;
            if (isNaN(e) || e <= 0 || e > balance) { alert("Ошибка в ставке!"); return; }
            if ("number" === betType && (isNaN(t) || t < 0 || t > 36)) { alert("Число от 0 до 36!"); return; }
                    balance -= e;
            document.getElementById("balance").innerText = balance;
            document.getElementById("status").innerText = "Колесо крутится...";
            isPlaying = true;
            
            const n = Math.floor(37 * Math.random());
            const l = n * (360 / 37), s = (360 - l) % 360;
            currentRotation += 7200 + s;
            canvas.style.transform = `rotate(${currentRotation}deg)`;
            
            setTimeout(() => {
                let l = false, s = 0, c = 0 === n ? "zero" : n % 2 == 1 ? "red" : "black";
                if ("number" === betType) { if (t === n) { l = true; s = 36 * e; } }
                else if ("color" === betType && a === c) { l = true; s = 2 * e; }
                
                let o = "zero" === c ? "ЗЕЛЁНОЕ ЗЕРО" : "red" === c ? "КРАСНОЕ" : "ЧЁРНОЕ";
                if (l) {
                    balance += s;
                    document.getElementById("status").innerText = `🎉 ПОБЕДА! Выпало число [${n}] (${o}). Плюс ${s} монет!`;
                } else {
                    document.getElementById("status").innerText = `❌ Проигрыш. Выпало число [${n}] (${o}).`;
                }
                
                let i = "zero" === c ? "#22c55e" : "red" === c ? "#ef4444" : "#334155";
                updateHistory(n, i);
                document.getElementById("balance").innerText = balance;
                isPlaying = false;
            }, 15000);
        }
        
        function updateHistory(e, t) {
            let a = document.getElementById("history-box"), n = document.createElement("div");
            n.className = "hist-item"; n.style.background = t; n.innerText = e;
            a.insertBefore(n, a.firstChild);
            if (a.children.length > 10) a.removeChild(a.lastChild);
        }
        drawWheel();
    </script>
</body>
</html>
